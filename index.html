<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>仁濟茶樓</title>
<style>
:root{
  --bg:#FDF6EC; --surface:#FFF; --border:#E8D5B0;
  --text:#2C1810; --muted:#8B6914;
  --teal:#1A6B5A; --teal-dark:#0F4A3D;
  --orange:#E07B39; --green:#2E7D52; --red:#C0392B; --gold:#D4A017;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif;
  background:var(--bg); color:var(--text);
  touch-action:none;
}
#app{ position:fixed; inset:0; width:100%; height:100%; overflow:hidden; }
.screen{
  position:absolute; inset:0; width:100%; height:100%;
  display:none; flex-direction:column;
  overflow-y:auto;
  background:var(--bg);
}
.screen.active{ display:flex; }

/* ---------- START SCREEN ---------- */
#screen-start{ align-items:center; justify-content:flex-start; padding:24px 16px 40px; }
.title-block{ text-align:center; margin:12px 0 20px; }
.title-block h1{
  font-size:28px; margin:0 0 6px; color:var(--teal-dark); font-weight:800;
  letter-spacing:1px;
}
.title-block .subtitle{ font-size:14px; color:var(--muted); margin:0; }
.emoji-row{ font-size:36px; margin:6px 0; }

.card{
  background:var(--surface); border:1.5px solid var(--border); border-radius:16px;
  padding:16px; width:100%; max-width:480px; margin:10px auto;
  box-shadow:0 2px 8px rgba(44,24,16,0.06);
}
.card h2{ font-size:16px; margin:0 0 12px; color:var(--text); font-weight:700; }
.card h2 .icon{ margin-right:6px; }

.option-row{ display:flex; gap:10px; flex-wrap:wrap; }
.option-btn{
  flex:1; min-width:130px; padding:14px 10px; border-radius:12px;
  border:2px solid var(--border); background:var(--bg); color:var(--text);
  font-size:15px; font-weight:700; cursor:pointer; transition:all .15s;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.option-btn .opt-emoji{ font-size:24px; }
.option-btn.selected{
  border-color:var(--teal); background:rgba(26,107,90,0.1); color:var(--teal-dark);
}
.option-btn:active{ transform:scale(0.97); }

.sticker-box{
  background:rgba(26,107,90,0.07); border:1.5px dashed var(--teal);
  border-radius:14px; padding:14px 16px; margin:14px auto; max-width:480px;
  font-size:14px; line-height:1.7; color:var(--text);
}
.sticker-box b{ color:var(--teal-dark); }
.sticker-box .arrow-demo{ font-size:20px; margin-top:6px; text-align:center; }

.btn-primary{
  display:block; width:100%; max-width:480px; margin:16px auto 0;
  padding:16px; border:none; border-radius:14px; background:var(--teal);
  color:#fff; font-size:18px; font-weight:800; cursor:pointer;
  box-shadow:0 4px 10px rgba(26,107,90,0.3); transition:transform .1s;
}
.btn-primary:active{ transform:scale(0.98); }
.btn-primary:disabled{ opacity:0.5; cursor:default; }
.btn-secondary{
  display:block; width:100%; max-width:480px; margin:10px auto 0;
  padding:14px; border:2px solid var(--teal); border-radius:14px; background:transparent;
  color:var(--teal-dark); font-size:16px; font-weight:700; cursor:pointer;
}

/* ---------- CALIBRATION SCREEN ---------- */
#screen-calib{ align-items:center; justify-content:center; padding:16px; position:relative; }
.calib-wrap{
  position:relative; width:100%; max-width:520px; aspect-ratio:4/3;
  background:#111; border-radius:16px; overflow:hidden;
  border:2px solid var(--border); box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.calib-wrap video, .calib-wrap canvas{
  position:absolute; inset:0; width:100%; height:100%; object-fit:fill;
  transform:scaleX(-1);
}
.calib-wrap canvas{ pointer-events:none; }
.calib-info{
  text-align:center; margin-top:14px; font-size:15px; color:var(--muted);
}
.calib-info .pixel-count{ font-weight:800; color:var(--teal-dark); font-size:20px; }
.calib-hint{
  text-align:center; font-size:13px; color:var(--muted); margin-top:4px; max-width:480px;
}

/* ---------- GAME SCREEN ---------- */
#screen-game{ padding:0; background:#000; }
.game-stage{ position:relative; width:100%; height:100%; overflow:hidden; }
.game-stage video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:fill;
  transform:scaleX(-1); opacity:0.25;
}
.game-stage canvas#gameCanvas{
  position:absolute; inset:0; width:100%; height:100%;
}
.hud{
  position:absolute; top:0; left:0; right:0; z-index:5;
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 12px; gap:6px;
  background:linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0));
  pointer-events:none;
}
.hud-item{
  background:rgba(255,255,255,0.92); border-radius:10px; padding:6px 10px;
  font-size:13px; font-weight:700; color:var(--text); min-width:56px; text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,0.15);
}
.hud-item .hud-label{ font-size:10px; color:var(--muted); font-weight:600; display:block; }
.hud-item .hud-value{ font-size:16px; }

.status-bar{
  position:absolute; bottom:0; left:0; right:0; z-index:5;
  text-align:center; padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.55));
  font-size:14px; font-weight:700; color:#fff; pointer-events:none;
}

.cog-overlay{
  position:absolute; top:56px; left:0; right:0; z-index:6;
  display:flex; justify-content:center; pointer-events:none;
}
.cog-badge{
  background:rgba(212,160,23,0.95); color:#fff; font-weight:800; font-size:15px;
  padding:8px 18px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.25);
}

.pause-btn{
  position:absolute; top:10px; right:10px; z-index:8;
  width:36px; height:36px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.85); font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* ---------- RESULT SCREEN ---------- */
#screen-result{ align-items:center; justify-content:center; padding:24px; }
.result-card{
  background:var(--surface); border:1.5px solid var(--border); border-radius:20px;
  padding:28px 24px; text-align:center; max-width:420px; width:100%;
  box-shadow:0 4px 16px rgba(44,24,16,0.1);
}
.result-card h2{ font-size:22px; color:var(--teal-dark); margin:0 0 16px; }
.result-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0 20px;
}
.result-grid .r-item{
  background:var(--bg); border-radius:12px; padding:12px; border:1px solid var(--border);
}
.result-grid .r-label{ font-size:12px; color:var(--muted); margin-bottom:4px; }
.result-grid .r-value{ font-size:22px; font-weight:800; color:var(--teal-dark); }

/* landscape adjustments */
@media (orientation:landscape){
  .title-block h1{ font-size:24px; }
}

.hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ START SCREEN ============ -->
  <div id="screen-start" class="screen active">
    <div class="title-block">
      <div class="emoji-row">🥟🖐️🦶</div>
      <h1>仁濟茶樓</h1>
      <p class="subtitle">上肢功能復康訓練遊戲</p>
    </div>

    <div class="card">
      <h2>遊戲類型</h2>
      <div class="option-row" id="gameTypeOptions">
        <button class="option-btn selected" data-gametype="reach">
          <span style="font-size:16px;font-weight:700;">Pinch 訓練</span>
          <span style="font-size:11px;color:var(--muted);font-weight:500;display:block;margin-top:2px;">練習手指捏力、靈活度與精細動作控制</span>
        </button>
        <button class="option-btn" data-gametype="grasp">
          <span style="font-size:16px;font-weight:700;">手指握放訓練</span>
          <span style="font-size:11px;color:var(--muted);font-weight:500;display:block;margin-top:2px;">握拳拿點心 + 張開手放下點心</span>
        </button>
      </div>
    </div>



    <div class="card">
      <h2>選擇難度</h2>
      <div class="option-row" id="levelOptions">
        <button class="option-btn selected" data-level="easy">
          <span class="opt-emoji" id="easyLevelEmoji">🥟🦐</span>
          簡單：分類配對
          <span style="font-size:11px;color:var(--muted);font-weight:500;" id="easyLevelFoods">燒賣 + 蝦餃</span>
        </button>
        <button class="option-btn" data-level="hard">
          進階：四種食物
          <span style="font-size:11px;color:var(--muted);font-weight:500;">燒鵝／瀨粉／炒飯／粥</span>
        </button>
      </div>
    </div>

    <div class="card">
      <h2>訓練模式</h2>
      <div class="option-row" id="modeOptions">
        <button class="option-btn selected" data-mode="single">
          單一任務
          <span style="font-size:11px;color:var(--muted);font-weight:500;">只需夾取食物</span>
        </button>
        <button class="option-btn" data-mode="dual">
          雙重任務
          <span style="font-size:11px;color:var(--muted);font-weight:500;">夾取＋認知指令</span>
        </button>
      </div>
    </div>

    <div class="card">
      <h2>遊戲時間</h2>
      <div class="option-row" id="durationOptions">
        <button class="option-btn selected" data-duration="300">
          5 分鐘
        </button>
        <button class="option-btn" data-duration="600">
          10 分鐘
        </button>
        <button class="option-btn" data-duration="900">
          15 分鐘
        </button>
      </div>
    </div>

    <div class="card">
      <h2>停留時間</h2>
      <div class="option-row" id="dwellOptions" style="flex-wrap:wrap;gap:8px;">
        <button class="option-btn" data-dwell="1000" style="flex:1 1 auto;min-width:60px;">1秒</button>
        <button class="option-btn" data-dwell="2000" style="flex:1 1 auto;min-width:60px;">2秒</button>
        <button class="option-btn selected" data-dwell="3000" style="flex:1 1 auto;min-width:60px;">3秒</button>
        <button class="option-btn" data-dwell="4000" style="flex:1 1 auto;min-width:60px;">4秒</button>
        <button class="option-btn" data-dwell="5000" style="flex:1 1 auto;min-width:60px;">5秒</button>
        <button class="option-btn" data-dwell="6000" style="flex:1 1 auto;min-width:60px;">6秒</button>
        <button class="option-btn" data-dwell="8000" style="flex:1 1 auto;min-width:60px;">8秒</button>
        <button class="option-btn" data-dwell="10000" style="flex:1 1 auto;min-width:60px;">10秒</button>
      </div>
    </div>

    <div class="card">
      <h2>字體大小</h2>
      <div class="option-row" id="fontOptions">
        <button class="option-btn" data-font="24">細</button>
        <button class="option-btn selected" data-font="36">中</button>
        <button class="option-btn" data-font="52">大</button>
        <button class="option-btn" data-font="70">特大</button>
      </div>
    </div>

    <button class="btn-primary" id="btnGoCalib">進入相機校準</button>
  </div>

  <!-- ============ CALIBRATION SCREEN ============ -->
  <div id="screen-calib" class="screen">
    <div class="title-block" style="margin-bottom:8px;">
      <h1 style="font-size:20px;">相機校準</h1>
    </div>
    <div class="calib-wrap">
      <video id="calibVideo" playsinline autoplay muted></video>
      <canvas id="calibOverlay"></canvas>
    </div>
    <div class="calib-info">
      手部偵測狀態：<span class="pixel-count" id="pixelCount">尚未偵測</span>
    </div>
    <div class="calib-hint">
      請將手掌置於鏡頭前，確認畫面中出現綠色圓點標記於食指尖位置後，即可開始遊戲。
    </div>
    <button class="btn-primary" id="btnStartGame" style="max-width:520px;" disabled>開始遊戲 ▶</button>
    <button class="btn-secondary" id="btnBackFromCalib" style="max-width:520px;">← 返回設定</button>
  </div>

  <!-- ============ GAME SCREEN ============ -->
  <div id="screen-game" class="screen">
    <div class="game-stage">
      <div id="levelIntroBanner" style="display:none;position:absolute;top:0;left:0;right:0;z-index:30;background:rgba(0,0,0,0.82);color:#fff;text-align:center;padding:10px 12px;font-size:14px;line-height:1.5;pointer-events:none;"></div>
      <video id="gameVideo" playsinline autoplay muted></video>
      <canvas id="gameCanvas"></canvas>
      <div class="hud">
        <div class="hud-item"><span class="hud-label">得分</span><span class="hud-value" id="hudScore">0</span></div>
        <div class="hud-item"><span class="hud-label">正確</span><span class="hud-value" id="hudCorrect">0</span></div>
        <div class="hud-item"><span class="hud-label">夾取</span><span class="hud-value" id="hudGrabs">0</span></div>
        <div class="hud-item"><span class="hud-label">時間</span><span class="hud-value" id="hudTime">60</span></div>
      </div>
      <div class="cog-overlay hidden" id="cogOverlay">
        <div class="cog-badge" id="cogBadge">指令</div>
      </div>
      <button class="pause-btn" id="btnPause">⏸</button>
      <div class="status-bar" id="statusBar">✋ 等待偵測手部…</div>
    </div>
  </div>

  <!-- ============ RESULT SCREEN ============ -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <h2>🎉 訓練完成！</h2>
      <div class="result-grid">
        <div class="r-item"><div class="r-label">總得分</div><div class="r-value" id="resScore">0</div></div>
        <div class="r-item"><div class="r-label">正確次數</div><div class="r-value" id="resCorrect">0</div></div>
        <div class="r-item"><div class="r-label">總夾取次數</div><div class="r-value" id="resGrabs">0</div></div>
        <div class="r-item"><div class="r-label">準確率</div><div class="r-value" id="resAccuracy">0%</div></div>
      </div>
      <button class="btn-primary" id="btnRetry">再玩一次</button>
      <button class="btn-secondary" id="btnHome">返回主頁</button>
    </div>
  </div>

</div>

<!-- MediaPipe loaded via ES module in JS -->
<script>
(function(){
"use strict";

/* ==================== 全域狀態 ==================== */
const state = {
  level: 'easy',        // easy | hard
  mode: 'single',       // single | dual
  duration: 300,        // total seconds
  labelFont: 36,        // label font size px
  dwellMs: 3000,        // dwell threshold ms
  stream: null,
  running: false,
  paused: false,
  gameType: 'reach',     // 'reach' | 'grasp'
  graspType: 'any',      // fixed: open-hand detection
};

/* ==================== DOM 快取 ==================== */
const screens = {
  start: document.getElementById('screen-start'),
  calib: document.getElementById('screen-calib'),
  game: document.getElementById('screen-game'),
  result: document.getElementById('screen-result'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ==================== 起始畫面互動 ==================== */
document.getElementById('levelOptions').addEventListener('click', (e)=>{
  const btn = e.target.closest('.option-btn');
  if(!btn) return;
  document.querySelectorAll('#levelOptions .option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.level = btn.dataset.level;
});
document.getElementById('modeOptions').addEventListener('click', (e)=>{
  const btn = e.target.closest('.option-btn');
  if(!btn) return;
  document.querySelectorAll('#modeOptions .option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.mode = btn.dataset.mode;
});

document.getElementById('gameTypeOptions').addEventListener('click', e=>{
  const btn = e.target.closest('.option-btn');
  if(!btn) return;
  document.querySelectorAll('#gameTypeOptions .option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.gameType = btn.dataset.gametype;
  updateEasyLevelLabel();
});

function updateEasyLevelLabel(){
  const emoji = document.getElementById('easyLevelEmoji');
  const foodsEl = document.getElementById('easyLevelFoods');
  if(state.gameType === 'grasp'){
    emoji.textContent = '🥟🍚';
    foodsEl.textContent = '叉燒包 + 糯米雞';
  } else {
    emoji.textContent = '🥟🦐';
    foodsEl.textContent = '燒賣 + 蝦餃';
  }
}


document.getElementById('durationOptions').addEventListener('click', e=>{
  const btn = e.target.closest('.option-btn');
  if(!btn) return;
  document.querySelectorAll('#durationOptions .option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.duration = parseInt(btn.dataset.duration);
});
document.getElementById('dwellOptions').addEventListener('click', e=>{
  const btn = e.target.closest('.option-btn');
  if(!btn) return;
  document.querySelectorAll('#dwellOptions .option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.dwellMs = parseInt(btn.dataset.dwell);
});

document.getElementById('fontOptions').addEventListener('click', e=>{
  const btn = e.target.closest('.option-btn');
  if(!btn) return;
  document.querySelectorAll('#fontOptions .option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  state.labelFont = parseInt(btn.dataset.font);
});

document.getElementById('btnGoCalib').addEventListener('click', async ()=>{
  showScreen('calib');
  document.getElementById('btnStartGame').disabled = true;
  document.getElementById('pixelCount').textContent = '尚未偵測';
  await ensureHandLandmarker();
  await startCamera('calibVideo');
  startCalibLoop();
});

document.getElementById('btnBackFromCalib').addEventListener('click', ()=>{
  stopCalibLoop();
  stopCamera();
  showScreen('start');
});

document.getElementById('btnStartGame').addEventListener('click', async ()=>{
  stopCalibLoop();
  // 唔 stop camera！直接將 stream 移到 gameVideo（避免 Safari 第二次 getUserMedia 失敗）
  showScreen('game');
  await new Promise(r => requestAnimationFrame(r));
  // 將同一條 stream reassign 俾 gameVideo
  if(state.stream){
    const gameVideo = document.getElementById('gameVideo');
    gameVideo.srcObject = state.stream;
    await gameVideo.play().catch(()=>{});
  } else {
    await startCamera('gameVideo');
  }
  resizeGameCanvas();
  initGame();
});

document.getElementById('btnRetry').addEventListener('click', ()=>{
  showScreen('start');
});
document.getElementById('btnHome').addEventListener('click', ()=>{
  stopCamera();
  showScreen('start');
});

document.getElementById('btnPause').addEventListener('click', ()=>{
  state.paused = !state.paused;
  document.getElementById('btnPause').textContent = state.paused ? '▶' : '⏸';
});

/* ==================== 相機控制 ==================== */
async function startCamera(videoElId){
  const videoEl = document.getElementById(videoElId);
  try{
    if(state.stream){
      state.stream.getTracks().forEach(t=>t.stop());
      state.stream = null;
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    state.stream = stream;
    videoEl.srcObject = stream;
    await videoEl.play().catch(()=>{});
  }catch(err){
    alert('無法啟動相機，請確認已授予相機權限。錯誤：' + err.message);
  }
}
function stopCamera(){
  if(state.stream){
    state.stream.getTracks().forEach(t=>t.stop());
    state.stream = null;
  }
}

/* ==================== MediaPipe Hand Landmarker ==================== */
let handLandmarker = null;
let handLandmarkerPromise = null;

async function ensureHandLandmarker(){
  if(handLandmarker) return handLandmarker;
  if(handLandmarkerPromise) return handLandmarkerPromise;
  handLandmarkerPromise = (async ()=>{
    const mpVision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const { HandLandmarker, FilesetResolver } = mpVision;
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 1
    });
    return handLandmarker;
  })();
  try{
    return await handLandmarkerPromise;
  }catch(err){
    handLandmarkerPromise = null;
    alert('無法載入手部偵測模型，請檢查網絡連線。錯誤：' + err.message);
    throw err;
  }
}

// 偵測食指尖位置，回傳 {detected, nx, ny}（nx/ny 已經鏡像處理，範圍 0-1）
function detectWrist(videoEl){
  if(!handLandmarker || videoEl.readyState < 2){
    return { detected:false };
  }
  let results;
  try{
    results = handLandmarker.detectForVideo(videoEl, performance.now());
  }catch(e){
    return { detected:false };
  }
  if(results && results.landmarks && results.landmarks.length > 0){
    const lm = results.landmarks[0]; // 第一隻手
    // Cursor position
    const tip = lm[8]; // index finger tip = landmark 8 (reach mode)
    // palm center = average of landmarks 0,5,9,13,17
    const palmX = (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
    const palmY = (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
    const nx = state.gameType === 'grasp' ? (1 - palmX) : (1 - tip.x);
    const ny = state.gameType === 'grasp' ? palmY : tip.y;
    const grasp = computeGraspScore(lm);
    return { detected:true, nx, ny, isGrasping: grasp.isGrasping, graspScore: grasp.score, lm };
  }
  return { detected:false };
}

function computeGraspScore(lm){
  // Returns { isGrasping: bool, score: 0-1 }
  // Uses palm-base distances to measure finger curl
  // lm = results.landmarks[0] (21 landmarks)
  const wrist = lm[0];

  // For each finger, measure how close tip is to palm (MCP base)
  // Landmarks: thumb tip=4, index tip=8, middle tip=12, ring tip=16, pinky tip=20
  // MCPs: thumb=2, index=5, middle=9, ring=13, pinky=17
  function curl(tipIdx, mcpIdx){
    const tip = lm[tipIdx], mcp = lm[mcpIdx], w = lm[0];
    // distance from tip to wrist, normalized by distance from MCP to wrist
    const tipDist = Math.hypot(tip.x-w.x, tip.y-w.y, tip.z-w.z);
    const mcpDist = Math.hypot(mcp.x-w.x, mcp.y-w.y, mcp.z-w.z);
    if(mcpDist < 0.001) return 0;
    // curl ratio: lower means more curled (tip closer to wrist than MCP)
    return Math.min(1, tipDist / mcpDist);
  }

  const thumbCurl = curl(4, 2);
  const indexCurl = curl(8, 5);
  const middleCurl = curl(12, 9);
  const ringCurl = curl(16, 13);
  const pinkyCurl = curl(20, 17);

  // isGrasping threshold: ratio < 0.85 means finger is curled
  const CURL_THRESH = 0.85;

  let isGrasping = false;
  if(state.graspType === 'full'){
    // all 5 fingers curled
    isGrasping = indexCurl < CURL_THRESH && middleCurl < CURL_THRESH &&
                 ringCurl < CURL_THRESH && pinkyCurl < CURL_THRESH;
  } else if(state.graspType === 'tripod'){
    // thumb + index + middle
    isGrasping = thumbCurl < CURL_THRESH && indexCurl < CURL_THRESH && middleCurl < CURL_THRESH;
  } else {
    // any: at least 2 fingers curled
    const curled = [thumbCurl, indexCurl, middleCurl, ringCurl, pinkyCurl].filter(c => c < CURL_THRESH).length;
    isGrasping = curled >= 2;
  }

  // score: average curl of relevant fingers (1 = fully open, 0 = fully closed)
  const avg = (indexCurl + middleCurl + ringCurl + pinkyCurl) / 4;
  return { isGrasping, score: 1 - avg };
}

const DOT_EMA = 0.35;

/* ==================== 校準畫面邏輯 ==================== */
let calibRAF = null;
const calibCanvas = document.getElementById('calibOverlay');
let calibDotEmaX = -1, calibDotEmaY = -1;
let calibDetectedOnce = false;

function startCalibLoop(){
  const video = document.getElementById('calibVideo');
  function loop(){
    if(!screens.calib.classList.contains('active')){ return; }
    const wrap = calibCanvas.parentElement;
    const rectW = wrap.clientWidth, rectH = wrap.clientHeight;
    if(calibCanvas.width !== rectW) calibCanvas.width = rectW;
    if(calibCanvas.height !== rectH) calibCanvas.height = rectH;
    const ctx = calibCanvas.getContext('2d');
    ctx.clearRect(0,0,rectW,rectH);

    const res = detectWrist(video);

    if(res.detected){
      document.getElementById('pixelCount').textContent = '✅ 偵測到手部';
      if(!calibDetectedOnce){
        calibDetectedOnce = true;
        document.getElementById('btnStartGame').disabled = false;
      }
      let px = res.nx * rectW;
      let py = res.ny * rectH;
      if(calibDotEmaX < 0){ calibDotEmaX = px; calibDotEmaY = py; }
      else{
        calibDotEmaX += DOT_EMA * (px - calibDotEmaX);
        calibDotEmaY += DOT_EMA * (py - calibDotEmaY);
      }
      ctx.beginPath();
      ctx.arc(calibDotEmaX, calibDotEmaY, 16, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(46,125,82,0.35)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(calibDotEmaX, calibDotEmaY, 8, 0, Math.PI*2);
      ctx.fillStyle = '#2E7D52';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    } else {
      document.getElementById('pixelCount').textContent = '尚未偵測';
      calibDotEmaX = -1; calibDotEmaY = -1;
    }
    calibRAF = requestAnimationFrame(loop);
  }
  calibRAF = requestAnimationFrame(loop);
}
function stopCalibLoop(){
  if(calibRAF) cancelAnimationFrame(calibRAF);
  calibRAF = null;
  calibDotEmaX = -1; calibDotEmaY = -1;
  calibDetectedOnce = false;
}

// "停住" 判斷：追蹤過去 0.4s 內游標最大位移
const STILL_WINDOW_MS = 400;
const STILL_MAX_DISP = 25;
let posHistory = []; // {t, x, y}

function isStill(now){
  // 清除過舊記錄
  while(posHistory.length && now - posHistory[0].t > STILL_WINDOW_MS){
    posHistory.shift();
  }
  if(posHistory.length < 2) return false;
  let maxDisp = 0;
  const base = posHistory[0];
  for(const p of posHistory){
    const d = Math.hypot(p.x - base.x, p.y - base.y);
    if(d > maxDisp) maxDisp = d;
  }
  // 也涵蓋整段時間窗口足夠長
  const span = now - posHistory[0].t;
  return maxDisp <= STILL_MAX_DISP && span >= STILL_WINDOW_MS * 0.6;
}

// 遊戲物件
let foods = [];      // {id, type, x, y, r, held, done}
let targets = [];    // {type, x, y, w, h, label}
let heldItem = null;
let score = 0, correctCount = 0, grabCount = 0;

// 雙重任務認知指令
let cogInstruction = null; // {type:'color'|'number'|'side', text, target}
let cogTimerId = null;

const FOOD_DEFS_EASY = [

  { type:'hargau', label:'蝦餃', img:imgHargau, targetType:'hargau' },
];
const FOOD_DEFS_GRASP = [

  { type:'lotusrice', label:'糯米雞', img:imgLotusrice, targetType:'lotusrice' },
];
const FOOD_DEFS_HARD = [
  { type:'siugo', label:'燒鵝', color:'#B5451B', targetType:'A' },

];

function initGame(){
  DWELL_MS = state.dwellMs; // 套用用家選擇嘅停留時間

  // ── 關卡說明 banner ──
  const banner = document.getElementById('levelIntroBanner');
  if(state.gameType === 'grasp'){
    banner.innerHTML = '本關卡為「手指握放訓練」，請跟著指令【握拳拿點心】與【張開手放下點心】來完成任務';
    banner.style.display = 'block';
    setTimeout(()=>{ banner.style.display='none'; }, 5000);
  } else {
    banner.style.display = 'none';
  }

  score = 0; correctCount = 0; grabCount = 0;
  heldItem = null; foods = []; targets = [];
  gripActive = false;
  isGrasping = false;
  cursorX = -1; cursorY = -1;
  dotEmaX = -1; dotEmaY = -1;
  handDetected = false;
  posHistory = [];

  timeLeft = state.duration; // 由用家選擇
  updateHUD();

  resizeGameCanvas();
  setupTargets();
  spawnInitialFoods();

  document.getElementById('statusBar').textContent = '✋ 等待偵測手部…';

  // 重置 dwell 計時器
  dwellTarget = null;
  dwellStartTime = 0;

  if(state.mode === 'dual'){
    document.getElementById('cogOverlay').classList.remove('hidden');
    rotateCognitiveInstruction();
    cogTimerId = setInterval(rotateCognitiveInstruction, 15000);
  } else {
    document.getElementById('cogOverlay').classList.add('hidden');
    if(cogTimerId){ clearInterval(cogTimerId); cogTimerId = null; }
  }

  state.running = true;
  state.paused = false;
  document.getElementById('btnPause').textContent = '⏸';

  if(gameTimerId) clearInterval(gameTimerId);
  gameTimerId = setInterval(()=>{
    if(state.paused || !state.running) return;
    timeLeft--;
    updateHUD();
    if(timeLeft <= 0){
      endGame();
    }
  }, 1000);

  if(gameRAF) cancelAnimationFrame(gameRAF);
  gameRAF = requestAnimationFrame(gameLoop);

  window.addEventListener('resize', resizeGameCanvas);
}

function resizeGameCanvas(){
  const stage = document.querySelector('.game-stage');
  const w = stage.clientWidth  || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;
  gameCanvas.width  = w || 390;
  gameCanvas.height = h || 844;
  gameCtx = gameCanvas.getContext('2d');
}

function isPortrait(){
  return gameCanvas.height > gameCanvas.width;
}

function setupTargets(){
  const cw = gameCanvas.width, ch = gameCanvas.height;
  const portrait = isPortrait();
  const tw = Math.min(cw * 0.46, 260);  // 碟子寬：更大，方便長者
  const th = tw * 0.62;
  const ty = portrait ? (ch - th/2 - 8) : (ch - th/2 - 12);  // 貼底對齊

  targets = [];
  if(state.level === 'easy'){
    if(state.gameType === 'grasp'){
      targets.push({ type:'charsiu',   label:'叉燒包', img:imgCharsiu,   x: cw*0.25, y: ty, w: tw, h: th, color:'#1A6B5A' });
      targets.push({ type:'lotusrice', label:'糯米雞', img:imgLotusrice, x: cw*0.75, y: ty, w: tw, h: th, color:'#E07B39' });
    } else {
      targets.push({ type:'siumai', label:'燒賣', img:imgSiumai, x: cw*0.25, y: ty, w: tw, h: th, color:'#1A6B5A' });
      targets.push({ type:'hargau', label:'蝦餃', img:imgHargau, x: cw*0.75, y: ty, w: tw, h: th, color:'#E07B39' });
    }
  } else {
    targets.push({ type:'A', label:'碗 A', x: cw*0.25, y: ty, w: tw, h: th, color:'#1A6B5A' });
    targets.push({ type:'B', label:'碗 B', x: cw*0.75, y: ty, w: tw, h: th, color:'#E07B39' });
  }
}

function randRange(a,b){ return a + Math.random()*(b-a); }

function spawnFood(){
  const cw = gameCanvas.width, ch = gameCanvas.height;
  const portrait = isPortrait();
  const r = portrait ? 120 : 156;  // 3x bigger for elderly visibility
  const defs = state.gameType === 'grasp' ? FOOD_DEFS_GRASP : (state.level === 'easy' ? FOOD_DEFS_EASY : FOOD_DEFS_HARD);
  const def = defs[Math.floor(Math.random()*defs.length)];
  const x = randRange(r*1.1, cw - r*1.1);
  const y = randRange(ch*0.15, ch*0.52);
  return {
    id: foodIdSeq++,
    type: def.type,
    label: def.label,
    targetType: def.targetType,
    img: def.img || null,
    color: def.color || null,
    x, y, r,
    baseX: x, baseY: y,
    held: false,
    removed: false,
  };
}

function spawnInitialFoods(){
  foods = [];
  const count = state.level === 'hard' ? 4 : 3;
  for(let i=0;i<count;i++){
    foods.push(spawnFood());
  }
}

function ensureFoodCount(){
  const target = state.level === 'hard' ? 4 : 3;
  const active = foods.filter(f=>!f.removed);
  while(active.length < target){
    const f = spawnFood();
    foods.push(f);
    active.push(f);
  }
}

/* ---------- 認知雙重任務 ---------- */
const COG_COLORS = [
  {name:'紅色', hex:'#C0392B'}, {name:'綠色', hex:'#2E7D52'},
  {name:'橙色', hex:'#E07B39'}, {name:'金色', hex:'#D4A017'},
];
function rotateCognitiveInstruction(){
  const types = ['color','number','side'];
  const t = types[Math.floor(Math.random()*types.length)];
  let text = '';
  if(t === 'color'){
    const c = COG_COLORS[Math.floor(Math.random()*COG_COLORS.length)];
    text = `請留意：${c.name}提示`;
  } else if(t === 'number'){
    const n = Math.floor(Math.random()*9)+1;
    text = `請記住數字：${n}`;
  } else {
    const side = Math.random() < 0.5 ? '左側' : '右側';
    text = `優先夾取${side}食物`;
  }
  cogInstruction = { type:t, text };
  document.getElementById('cogBadge').textContent = '🧠 ' + text;
}

/* ---------- HUD 更新 ---------- */
function updateHUD(){
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudCorrect').textContent = correctCount;
  document.getElementById('hudGrabs').textContent = grabCount;
  document.getElementById('hudTime').textContent = Math.max(0, timeLeft);
}

/* ---------- 主遊戲迴圈 ---------- */
function gameLoop(){
  if(!state.running){ return; }
  if(!state.paused){
    updateTracking();
    updateGameLogic();
    renderGame();
  }
  gameRAF = requestAnimationFrame(gameLoop);
}

function updateTracking(){
  const res = detectWrist(gameVideo);
  const cw = gameCanvas.width, ch = gameCanvas.height;

  handDetected = res.detected;

  if(res.detected){
    const px = res.nx * cw;
    const py = res.ny * ch;
    if(dotEmaX < 0){ dotEmaX = px; dotEmaY = py; }
    else{
      dotEmaX += DOT_EMA * (px - dotEmaX);
      dotEmaY += DOT_EMA * (py - dotEmaY);
    }
    cursorX = dotEmaX;
    cursorY = dotEmaY;
    posHistory.push({ t: performance.now(), x: cursorX, y: cursorY });
    if(state.gameType === 'grasp'){
      isGrasping = res.isGrasping || false;
    }
  } else {
    cursorX = -1; cursorY = -1;
    dotEmaX = -1; dotEmaY = -1;
    posHistory = [];
    isGrasping = false;
    if(!heldItem) gripActive = false;
  }
}

function dist(x1,y1,x2,y2){
  return Math.hypot(x1-x2, y1-y2);
}

let lastDwellPct = 0;
let dwellActive = false;

function updateGameLogic(){
  if(state.gameType === 'grasp'){
    updateGraspLogic();
    return;
  }
  const statusBar = document.getElementById('statusBar');
  dwellActive = false;
  lastDwellPct = 0;

  if(cursorX >= 0 && cursorY >= 0 && handDetected){
    const now = performance.now();
    const still = isStill(now);

    if(!heldItem){
      // 找最近食物
      let nearest = null, nearestDist = Infinity;
      for(const f of foods){
        if(f.removed || f.held) continue;
        const d = dist(cursorX, cursorY, f.x, f.y);
        if(d < nearestDist){ nearestDist = d; nearest = f; }
      }
      const overFood = nearest && nearestDist <= 120;
      if(overFood && still){
        if(dwellTarget !== 'food'){
          dwellTarget = 'food';
          dwellStartTime = now;
        }
        const elapsed = now - dwellStartTime;
        if(elapsed >= DWELL_MS){
          // 夾起
          nearest.held = true;
          heldItem = nearest;
          gripActive = true;
          grabCount++;
          dwellTarget = null;
          updateHUD();
          statusBar.textContent = '✅ 夾起！移到碟上';
        } else {
          dwellActive = true;
          lastDwellPct = elapsed / DWELL_MS;
          const pct = Math.round(lastDwellPct * 100);
          statusBar.textContent = '停住…' + pct + '%';
        }
      } else {
        dwellTarget = null;
        if(!handDetected) statusBar.textContent = '✋ 等待偵測手部…';
        else statusBar.textContent = '移動食指到食物上方';
      }
    }

    if(heldItem && gripActive){
      heldItem.x = cursorX;
      heldItem.y = cursorY;
    }

    // 夾住食物時：停在碟上 DWELL_MS 自動放下
    if(heldItem && gripActive){
      let onPlate = null;
      for(const t of targets){
        const withinX = cursorX >= (t.x - t.w/2 - 130) && cursorX <= (t.x + t.w/2 + 130);
        const withinY = cursorY >= (t.y - t.h/2 - 130) && cursorY <= (t.y + t.h/2 + 130);
        if(withinX && withinY){ onPlate = t; break; }
      }
      if(onPlate && still){
        if(dwellTarget !== 'plate'){
          dwellTarget = 'plate';
          dwellStartTime = now;
        }
        const elapsed = now - dwellStartTime;
        if(elapsed >= DWELL_MS){
          // 放下
          if(onPlate.type === heldItem.targetType){
            score += 10; correctCount++;
          } else {
            score = Math.max(0, score - 3);
          }
          updateHUD();
          heldItem.removed = true;
          heldItem = null;
          gripActive = false;
          dwellTarget = null;
          ensureFoodCount();
          statusBar.textContent = '✅ 放低！';
        } else {
          dwellActive = true;
          lastDwellPct = elapsed / DWELL_MS;
          const pct = Math.round(lastDwellPct * 100);
          statusBar.textContent = '停住放低…' + pct + '%';
        }
      } else {
        dwellTarget = null;
        statusBar.textContent = '夾起！移到碟上';
      }
    }
  } else {
    dwellTarget = null;
    statusBar.textContent = '✋ 等待偵測手部…';
    if(!heldItem){ gripActive = false; }
  }
}

/* ---------- 握放模式邏輯 ---------- */
function updateGraspLogic(){
  const statusBar = document.getElementById('statusBar');

  if(cursorX < 0 || !handDetected){
    statusBar.textContent = '✋ 等待偵測手部…';
    return;
  }

  if(!heldItem){
    // 嘗試抓取：游標接近食物 並 正在握拳
    if(isGrasping){
      for(const f of foods){
        if(f.removed) continue;
        const d = dist(cursorX, cursorY, f.x, f.y);
        if(d < f.r + 80){  // larger grab zone
          f.held = true;
          heldItem = f;
          grabCount++;
          updateHUD();
          break;
        }
      }
    }
    if(heldItem){
      statusBar.textContent = '✊ 保持握緊 → 移到碟上';
    } else if(isGrasping){
      statusBar.textContent = '✊ 握拳夾起！移近食物';
    } else {
      statusBar.textContent = '🖐️ 張開手 → 移到食物上方';
    }
  } else {
    // 正握住食物：跟隨游標移動
    heldItem.x = cursorX;
    heldItem.y = cursorY;

    // 放低：鬆開手 並 接近碟子
    if(!isGrasping){
      let onPlate = null;
      for(const t of targets){
        const withinX = cursorX >= (t.x - t.w/2 - 130) && cursorX <= (t.x + t.w/2 + 130);
        const withinY = cursorY >= (t.y - t.h/2 - 130) && cursorY <= (t.y + t.h/2 + 130);
        if(withinX && withinY){ onPlate = t; break; }
      }
      if(onPlate){
        if(heldItem.targetType === onPlate.type){
          score += 10; correctCount++;
        } else {
          score = Math.max(0, score - 3);
        }
        updateHUD();
        heldItem.removed = true;
        heldItem.held = false;
        heldItem = null;
        ensureFoodCount();
        statusBar.textContent = '✅ 放低！';
      } else {
        // 未到碟上便鬆手：放返原位（唔移除）
        heldItem.held = false;
        heldItem.x = heldItem.baseX;
        heldItem.y = heldItem.baseY;
        heldItem = null;
        statusBar.textContent = '🖐️ 已鬆開，移到食物再握緊';
      }
    } else {
      statusBar.textContent = '✊ 保持握緊 → 移到碟上';
    }
  }
}

/* ---------- 繪製 ---------- */
function renderGame(){
  const ctx = gameCtx;
  const cw = gameCanvas.width, ch = gameCanvas.height;
  ctx.clearRect(0,0,cw,ch);

  // 目標盤
  const LBL_SIZE = state.labelFont || 36;
  for(const t of targets){
    ctx.save();
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.80)';
    const tH = t.h + (t.img ? LBL_SIZE * 1.4 : 0); // extra height for image
    roundRect(ctx, t.x - t.w/2, t.y - tH/2, t.w, tH, 14);
    ctx.fill();
    ctx.stroke();
    // draw image if available
    if(t.img && t.img.complete && t.img.naturalWidth > 0){
      const imgSz = Math.min(t.w * 0.65, LBL_SIZE * 1.6);
      ctx.drawImage(t.img, t.x - imgSz/2, t.y - tH/2 + 8, imgSz, imgSz);
      // label below image
      ctx.fillStyle = '#000';
      ctx.font = `bold ${LBL_SIZE}px "PingFang TC","Noto Sans TC",-apple-system,sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(t.label, t.x, t.y - tH/2 + 8 + imgSz + 4);
    } else {
      ctx.fillStyle = '#000';
      ctx.font = `bold ${LBL_SIZE}px "PingFang TC","Noto Sans TC",-apple-system,sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.label, t.x, t.y);
    }
    ctx.restore();
  }

  // 食物
  for(const f of foods){
    if(f.removed) continue;
    ctx.save();
    if(f.img && f.img.complete && f.img.naturalWidth > 0){
      const size = f.r * 2;
      ctx.drawImage(f.img, f.x - f.r, f.y - f.r, size, size);
    } else {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fillStyle = f.color || '#D4A017';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#2C1810';
      ctx.font = 'bold 14px -apple-system,"PingFang TC","Noto Sans TC",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.label, f.x, f.y);
    }
    if(f.held){
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r + 6, 0, Math.PI*2);
      ctx.strokeStyle = '#D4A017';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 游標：大圓點 + 停留進度環 / 握放手勢圖示
  if(cursorX >= 0 && cursorY >= 0 && handDetected){
    ctx.save();

    if(state.gameType === 'grasp'){
      // 握放模式：張開手 = 大空心圓；握拳 = 實心橙色圓
      if(isGrasping){
        // 握拳：實心橙色圓
        ctx.beginPath();
        ctx.arc(cursorX, cursorY, 28, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(224,123,57,0.85)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px -apple-system,"PingFang TC","Noto Sans TC",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✊', cursorX, cursorY);
      } else {
        // 張開手：白色空心圓
        ctx.beginPath();
        ctx.arc(cursorX, cursorY, 30, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px -apple-system,"PingFang TC","Noto Sans TC",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🖐️', cursorX, cursorY);
      }
    } else {
      const still = dwellActive || dwellTarget;
      const fillColor = still ? '#2E7D52' : '#E07B39';

      // 外圈白邊（增加可見度）
      ctx.beginPath();
      ctx.arc(cursorX, cursorY, 22, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fill();

      // 主色圓
      ctx.beginPath();
      ctx.arc(cursorX, cursorY, 18, 0, Math.PI*2);
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      // 中心小白點
      ctx.beginPath();
      ctx.arc(cursorX, cursorY, 4, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fill();

      // 停留進度環
      if(dwellActive && lastDwellPct > 0){
        ctx.beginPath();
        ctx.arc(cursorX, cursorY, 26, -Math.PI/2, -Math.PI/2 + lastDwellPct * Math.PI*2);
        ctx.strokeStyle = '#2E7D52';
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* ---------- 結束遊戲 ---------- */
function endGame(){
  state.running = false;
  if(gameTimerId){ clearInterval(gameTimerId); gameTimerId = null; }
  if(cogTimerId){ clearInterval(cogTimerId); cogTimerId = null; }
  if(gameRAF){ cancelAnimationFrame(gameRAF); gameRAF = null; }
  window.removeEventListener('resize', resizeGameCanvas);
  stopCamera();

  document.getElementById('resScore').textContent = score;
  document.getElementById('resCorrect').textContent = correctCount;
  document.getElementById('resGrabs').textContent = grabCount;
  const acc = grabCount > 0 ? Math.round((correctCount/grabCount)*100) : 0;
  document.getElementById('resAccuracy').textContent = acc + '%';

  showScreen('result');
}

})();
</script>
